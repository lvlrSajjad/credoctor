name: publish

# Trusted publishing: npm authenticates this workflow via OIDC, so there is no token
# stored in the repository and nothing to leak or rotate. The trade-off is that the
# configuration on npmjs.com must match this file exactly — see RELEASING.md.
#
# Publishing is driven by a tag so the released artifact is tied to a specific commit:
#   npm version patch && git push --follow-tags

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: lets the runner mint the OIDC token npm exchanges

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22.14+ and npm 11.5.1+ are hard requirements for trusted publishing.
      # setup-node ships an older npm with Node 22, so it is upgraded explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Deliberately no registry-url: setup-node would write an .npmrc containing an
          # _authToken placeholder, and npm may then attempt token auth instead of the OIDC
          # exchange. The default registry is registry.npmjs.org anyway.
      - name: use an npm that supports OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Publishing a build that was never checked is how a broken release happens.
      # prepublishOnly runs these too; running them here fails the job earlier and louder.
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/smoke.mjs

      # A tag that disagrees with package.json means one of them is wrong, and guessing
      # which produces a published version nobody can reproduce from a tag.
      - name: tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      # No NODE_AUTH_TOKEN. npm detects the OIDC environment and exchanges it for a
      # short-lived publish token. Provenance is attached automatically for public repos.
      #
      # When that exchange fails npm says nothing about it at the default loglevel: the whole
      # symptom is a bare ENEEDAUTH, which reads as "no token" and hides whether the registry
      # refused the exchange, or npm never attempted one. Retrying verbose on failure puts the
      # registry's actual answer in the log, so the next person fixes the trusted publisher
      # instead of guessing at it. The happy path stays quiet, and on the failing path no
      # publish token was ever minted, so there is nothing in that output to leak.
      - name: publish
        run: |
          if npm publish; then exit 0; fi
          echo "::error::npm publish failed — retrying verbose to capture why"
          npm publish --loglevel verbose
