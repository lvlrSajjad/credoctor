name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the one that matters most here — it is the platform the author cannot
        # test locally, and the one most of this tool's audience runs.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Electron is a large devDependency the tests do not need, and downloading its binary
      # on every matrix leg wastes minutes for no coverage.
      - run: npm ci --omit=optional
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm run build
      - name: functional smoke test
        run: node scripts/smoke.mjs
      - name: cli runs from a packed tarball
        shell: bash
        run: |
          npm pack --silent
          tarball=$(ls credoctor-*.tgz)
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install --silent "$OLDPWD/$tarball"
          ./node_modules/.bin/credoctor --help
